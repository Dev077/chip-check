[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chip-check"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.65.0",
    "absl-py>=1.0.0",
]

[project.scripts]
evaluate = "macro_place.evaluate:main"

[tool.setuptools.packages.find]
include = ["macro_place*"]

